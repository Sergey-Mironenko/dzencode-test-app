version: '3.8'
services:
  db:
    image: mysql:8.0
    restart: always
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_DATABASE: inventory_app
    ports:
      - "3307:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  server:
    build: .
    command: sh -c "npx prisma migrate deploy && node server.js"
    restart: always
    ports:
      - "4000:4000"
    environment:
      - DATABASE_URL=mysql://root:1234@db:3306/inventory_app
      - SECRET_KEY=super_secret_jwt_key_123
      - PORT=4000
    depends_on:
      - db

  app:
    build: .
    restart: always
    ports:
      - "3000:3000"
    environment:
      - DATABASE_URL=mysql://root:1234@db:3306/inventory_app
      - NEXT_PUBLIC_API_URL=http://localhost:4000
    depends_on:
      - db
      - server

volumes:
  mysql_data: